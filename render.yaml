services:
  - type: web
    name: forge-flight-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health/
    disk:
      name: forge-flight-media
      mountPath: /opt/render/project/src/backend/media
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BEHIND_TLS_PROXY
        value: "True"
      - key: DJANGO_MEDIA_ROOT
        value: /opt/render/project/src/backend/media
      - key: DJANGO_SERVE_MEDIA
        value: "True"
      - key: NUM_PROXIES
        value: "1"
